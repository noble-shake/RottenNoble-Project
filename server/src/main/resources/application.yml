server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:RottenNobleDB}
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      # 스키마는 backend/sql/schema.sql(그대로 재사용)이 진실의 원천 — Hibernate가 테이블을
      # 자동 생성/변경하지 않고, 엔티티 매핑이 기존 스키마와 맞는지만 시작 시점에 검증한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  cors:
    # PHP 시절 전체 엔드포인트가 쓰던 와일드카드(*) 대신 처음부터 명시적 허용목록으로 시작한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://rotten-noble.com,https://www.rotten-noble.com,http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:admin}
    # password_hash()로 만든 PHP 시절 bcrypt 해시를 그대로 재사용할 수 있다 — bcrypt는
    # $2y$/$2a$/$2b$ 리비전 표기만 다를 뿐 알고리즘은 동일해서 BCryptPasswordEncoder가 그대로
    # 검증한다(로컬에서 직접 확인 필요 — 이 환경엔 java가 없어 못 돌려봄).
    password-hash: ${ADMIN_PASSWORD_HASH:}
  encryption:
    # openssl rand -base64 32로 생성한 값 — backend/lib/crypto.php가 쓰던 것과 같은 키를 그대로
    # 쓰면 PHP가 암호화해둔 기존 방명록 데이터도 이 서버가 그대로 복호화할 수 있다(포맷을
    # CryptoService에서 동일하게 맞춰뒀다).
    field-key: ${FIELD_ENCRYPTION_KEY:}
