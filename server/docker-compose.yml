# server/docker-compose.yml
# 로컬/NAS 실행용. MariaDB는 이미 NAS에 있는 인스턴스를 그대로 쓰는 걸 기본으로 하고
# (DB_HOST 등을 환경변수로 그 인스턴스를 가리키게 한다) — 로컬에서 완전히 새로 띄우고
# 싶을 때만 아래 mariadb 서비스 주석을 풀고 DB_HOST=mariadb로 바꾼다.
version: "3.8"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-RottenNobleDB}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://rotten-noble.com,https://www.rotten-noble.com,http://localhost:5173}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

