# application-local.yml 템플릿 — 이 파일을 복사해 application-local.yml로 만든 뒤 실제 값을 채운다.
# application-local.yml은 .gitignore에 등록되어 있어 git에 올라가지 않는다
# (backend/config.local.php와 같은 원칙 — MEMO-WEB-01 참고).

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/RottenNobleDB
    username: root
    password: ""
  data:
    redis:
      host: localhost
      port: 6379

admin:
  username: admin
  # password_hash('실제비밀번호', BCRYPT)의 결과만 넣는다 — 평문 금지.
  password-hash: ""
